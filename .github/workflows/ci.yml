name: QUALIFIL CI

on:
  push:
    branches:
      - main
      - "sprint/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: qualifil-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: qualifil_test
          POSTGRES_USER: qualifil_test
          POSTGRES_PASSWORD: qualifil_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qualifil_test" --health-interval 10s
          --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql://qualifil_test:qualifil_test@localhost:5432/qualifil_test
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/**

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements/dev.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest

  ai-service-tests:
    name: AI Service Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install AI service dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f ai-service/requirements-dev.txt ]; then
            pip install -r ai-service/requirements-dev.txt
          elif [ -f ai-service/requirements.txt ]; then
            pip install -r ai-service/requirements.txt
          elif [ -f ai-service/pyproject.toml ]; then
            pip install ai-service
          else
            echo "No AI service dependency manifest found; skipping dependency installation."
          fi

      - name: Run AI service tests
        working-directory: ai-service
        run: |
          if [ -d tests ] || find . -name "test_*.py" -o -name "*_tests.py" | grep -q .; then
            python -m pytest -q
          else
            echo "No AI service tests found."
          fi

  # Web and mobile checks activate automatically once their package manifests
  # exist. Sprints 01D and 01E create them.
  web-checks:
    name: Web Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect web application
        id: web
        run: |
          if [ -f web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Web application is not initialized yet; skipping web checks."
          fi

      - name: Set up Node.js
        if: steps.web.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web dependencies
        if: steps.web.outputs.present == 'true'
        working-directory: web
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run web checks
        if: steps.web.outputs.present == 'true'
        working-directory: web
        run: |
          npm run build --if-present
          npm run lint --if-present
          npm test -- --run

  mobile-checks:
    name: Mobile Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect mobile application
        id: mobile
        run: |
          if [ -f mobile/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Mobile application is not initialized yet; skipping mobile checks."
          fi

      - name: Set up Node.js
        if: steps.mobile.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install mobile dependencies
        if: steps.mobile.outputs.present == 'true'
        working-directory: mobile
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run mobile checks
        if: steps.mobile.outputs.present == 'true'
        working-directory: mobile
        run: |
          npm run lint --if-present
          npm test -- --run
          npx tsc --noEmit