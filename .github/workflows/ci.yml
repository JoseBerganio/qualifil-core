name: QUALIFIL CI

on:
  push:
    branches:
      - main
      - "sprint/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: qualifil-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: qualifil_test
          POSTGRES_USER: qualifil_test
          POSTGRES_PASSWORD: qualifil_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qualifil_test" --health-interval 10s
          --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql://qualifil_test:qualifil_test@localhost:5432/qualifil_test
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/**

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements/dev.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest

  ai-service-tests:
    name: AI Service Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install AI service dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f ai-service/requirements-dev.txt ]; then
            pip install -r ai-service/requirements-dev.txt
          elif [ -f ai-service/requirements.txt ]; then
            pip install -r ai-service/requirements.txt
          elif [ -f ai-service/pyproject.toml ]; then
            pip install ai-service
          else
            echo "No AI service dependency manifest found; skipping dependency installation."
          fi

      - name: Run AI service tests
        working-directory: ai-service
        run: |
          if [ -d tests ] || find . -name "test_*.py" -o -name "*_tests.py" | grep -q .; then
            python -m pytest -q
          else
            echo "No AI service tests found."
          fi

  web-checks:
    name: Web Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Build shared API client
        run: npm run build -w @qualifil/api-client

      - name: Run shared client checks
        run: |
          npm run lint -w @qualifil/api-client
          npm test -w @qualifil/api-client

      - name: Run web checks
        run: |
          npm run build -w qualifil-web
          npm run lint -w qualifil-web
          npm test -w qualifil-web -- --run

  mobile-checks:
    name: Mobile Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Build shared API client
        run: npm run build -w @qualifil/api-client

      - name: Run mobile checks
        run: |
          npm run lint -w qualifil-mobile
          npm run typecheck -w qualifil-mobile
          npm test -w qualifil-mobile -- --watchAll=false --runInBand
